<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded iOS App Icon Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>
  
  <!-- Subtle accent circle -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="16 8"/>
  
  <!-- Rupee Symbol -->
  <path d="M190 160 H322 M190 208 H300 M190 160 V260 C230 260 270 240 270 208 C270 176 230 160 190 160 Z M215 256 L310 352" 
        stroke="url(#emeraldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Tiny sparkles -->
  <circle cx="340" cy="160" r="8" fill="#6ee7b7" />
</svg>
